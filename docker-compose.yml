services:
  nginx:
    image: nginx:alpine
    container_name: proxy-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-backend
    networks:
      - red-ejemplo-082

  db:
    image: mysql:8.0
    container_name: servidor-bd-082
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - red-ejemplo-082
    health-check:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  app-backend:
    image: mariana220308/sample-api:v1
    container_name: backend-082
    restart: always
    depends_on:
      db:
        condition: service_healthy
      healthcheck:
      test:  ["CMD-SHELL", "curl -f http://localhost:5050/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "5050:5050"
    networks:
      - red-ejemplo-082
  

volumes:
  mysql-data:

networks:
  red-ejemplo-082: